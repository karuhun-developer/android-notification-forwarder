name: Android tag release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Validate release tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            printf 'Unsupported tag: %s. Use v1.2.3 or v1.2.3-beta.1.\n' "$TAG_NAME" >&2
            exit 1
          fi
          printf 'APP_VERSION=%s\n' "${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Test, lint, and build APKs
        run: |
          bash gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            --no-daemon --console=plain \
            -PreleaseVersionName="$APP_VERSION" -PreleaseVersionCode="$GITHUB_RUN_NUMBER"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/notification-forwarder-${TAG_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/notification-forwarder-${TAG_NAME}-release-unsigned.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-${{ github.ref_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-validation-${{ github.ref_name }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-${{ github.ref_name }}
          path: release-assets/

      - name: Verify downloaded assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          prerelease_args=()
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --generate-notes --title "Notification Forwarder $TAG_NAME" \
              --notes "APK debug dapat di-install untuk pengujian. APK release-unsigned perlu ditandatangani dengan keystore sendiri sebelum di-install atau didistribusikan." \
              "${prerelease_args[@]}"
          fi
          gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "${prerelease_args[@]}"
